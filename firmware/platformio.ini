; =============================================================================
; PlatformIO Project Configuration for TARA AI Companion Robot
; Target: Standard ESP32 (dual-core Xtensa LX6 @ 240MHz)
; =============================================================================

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino

; Standard ESP32 CPU Frequency (240MHz default)
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Compiler Flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -I include
    -I src

; Built-in and standard lightweight libraries for Standard ESP32
lib_deps =
    WiFi
    WebServer
    Update
    Preferences
    Wire
    HTTPClient
    WiFiClientSecure
