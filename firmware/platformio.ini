; =============================================================================
; PlatformIO Project Configuration for TARA AI Companion Robot
; Target: Standard ESP32 (dual-core Xtensa LX6 @ 240MHz)
; =============================================================================

[platformio]
default_envs = esp32dev_production

[env]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    WiFi
    WebServer
    Update
    Preferences
    Wire
    HTTPClient
    WiFiClientSecure

; -----------------------------------------------------------------------------
; PRODUCTION ENVIRONMENT (Real Hardware + Strict TLS Root CA + Constant-time Auth)
; -----------------------------------------------------------------------------
[env:esp32dev_production]
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D TARA_PRODUCTION=1
    -I include
    -I src

; -----------------------------------------------------------------------------
; SIMULATION ENVIRONMENT (Hardware-Free Development & Mock Drivers)
; -----------------------------------------------------------------------------
[env:esp32dev_simulation]
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D TARA_SIMULATION=1
    -D TARA_MOCK_HARDWARE=1
    -I include
    -I src
